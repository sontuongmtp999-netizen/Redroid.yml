name: Redroid Cloud Phone Web UI

on:
  workflow_dispatch:

jobs:
  run-redroid:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Kết nối Tailscale tự động bằng Auth Key
        uses: tailscale/github-action@v2
        with:
          authkey: tskey-auth-kqVQMiWebE11CNTRL-AVzohRdb6N7EHSv2VkrsM7kNPJFWLmYi

      - name: Kiểm tra mô-đun Kernel & KVM
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true
          ls -l /dev/binder* /dev/kvm || true

      - name: Khởi chạy Redroid Android 11 Container
        run: |
          sudo docker run -d --name redroid-phone \
            --privileged \
            --net=host \
            -v /data:/data \
            redroid/redroid:11.0.0-latest \
            androidboot.hardware=redroid \
            gles.enabled=1

      - name: Khởi chạy Web UI (scrcpy-web qua Docker)
        run: |
          sudo docker run -d --name redroid-web \
            --net=host \
            -e ADB_SERVER_IP=127.0.0.1 \
            -e DEVICE_PORT=5555 \
            -p 8000:8000 \
            cybertec/scrcpy-web || sudo docker run -d --name redroid-web --net=host -p 8000:8000 budtmo/docker-android:emulator_11 || true

      - name: Lấy IP Tailscale để mở Web
        run: |
          echo "=== IP TAILSCALE CỦA WEB UI ==="
          tailscale ip -4

      - name: Giữ Session sống 6 tiếng
        run: |
          echo "Đang chạy! Truy cập http://<IP_TAILSCALE>:8000 trên trình duyệt."
          sleep 21600
