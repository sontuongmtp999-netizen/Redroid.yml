name: Redroid Cloud Phone on GitHub Actions

on:
  workflow_dispatch:

jobs:
  run-redroid:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Kết nối Tailscale tự động bằng Auth Key
        uses: tailscale/github-action@v2
        with:
          authkey: tskey-auth-kqVQMiWebE11CNTRL-AVzohRdb6N7EHSv2VkrsM7kNPJFWLmYi
          args: --advertise-tags=tag:ci --accept-routes

      - name: Kiểm tra mô-đun Kernel & KVM
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true
          ls -l /dev/binder* /dev/kvm || true

      - name: Khởi chạy Redroid Android 11 Container
        run: |
          sudo docker run -d --name redroid-phone \
            --privileged \
            -p 5555:5555 \
            -v /data:/data \
            redroid/redroid:11.0.0_latest \
            androidboot.hardware=redroid \
            gles.enabled=1

      - name: Khởi chạy Scrcpy Web Client (Điều khiển qua Trình duyệt)
        run: |
          sudo docker run -d --name redroid-web \
            --link redroid-phone:redroid-phone \
            -p 8000:8000 \
            -e DEVICE_IP=redroid-phone \
            -e DEVICE_PORT=5555 \
            soraxas/scrcpy-server

      - name: Hiển thị IP Tailscale kết nối
        run: |
          echo "=== IP TAILSCALE CỦA CLOUD PHONE ==="
          tailscale ip -4

      - name: Giữ Session sống 6 tiếng
        run: |
          echo "Redroid Cloud Phone đang chạy! Mở web qua IP Tailscale cổng 8000."
          sleep 21600
