name: Redroid Cloud Phone on GitHub Actions

on:
  workflow_dispatch:

jobs:
  run-redroid:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Kết nối Tailscale tự động bằng Auth Key
        uses: tailscale/github-action@v2
        with:
          authkey: tskey-auth-kqVQMiWebE11CNTRL-AVzohRdb6N7EHSv2VkrsM7kNPJFWLmYi

      - name: Kiểm tra mô-đun Kernel & KVM
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true
          ls -l /dev/binder* /dev/kvm || true

      - name: Khởi chạy Redroid Android 11 Container
        run: |
          sudo docker run -d --name redroid-phone \
            --privileged \
            -p 5555:5555 \
            -v /data:/data \
            redroid/redroid:11.0.0-latest \
            androidboot.hardware=redroid \
            gles.enabled=1

      - name: Lấy IP Tailscale để kết nối ADB
        run: |
          echo "=== IP TAILSCALE CỦA CLOUD PHONE ==="
          tailscale ip -4

      - name: Giữ Session sống 6 tiếng
        run: |
          echo "Redroid đang chạy! Dùng lệnh: adb connect <IP_TAILSCALE>:5555 để điều khiển."
          sleep 21600
