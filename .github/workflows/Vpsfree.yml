name: Windows Cloud PC Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Bật tính năng Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin CloudPC@12345

      - name: Chạy Pinggy TCP Tunnel cho cổng RDP (3389)
        run: |
          # Dùng ssh kết nối tới a.pinggy.io để forward cổng 3389 qua cổng 443 (né mọi tường lửa)
          ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:3389 a.pinggy.iolocalhost:3389 serveo.net
