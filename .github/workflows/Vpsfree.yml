name: Windows Cloud PC Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Bật tính năng Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin CloudPC@12345

      - name: Chạy Pinggy TCP Tunnel cho cổng RDP (3389)
        run: |
          ssh -p 443 -o StrictHostKeyChecking=no -R 0:localhost:3389 a.pinggy.io
          ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:3389 a.pinggy.iolocalhost:3389 serveo.net
