name: Windows Cloud PC RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Bật tính năng Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          # Đổi mật khẩu tài khoản runner thành một chuỗi dễ nhớ để lát đăng nhập
          net user runneradmin CloudPC@12345

      - name: Cài đặt và chạy Serveo TCP Tunnel cho cổng RDP (3389)
        run: |
          # Dùng lệnh SSH tích hợp sẵn trên Windows để mở đường hầm Serveo vào cổng 3389 của RDP
          ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
