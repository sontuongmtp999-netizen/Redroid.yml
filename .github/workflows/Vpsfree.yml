name: Windows Cloud PC Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Bật tính năng Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin CloudPC@12345

      - name: Cài đặt Tailscale
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          powershell -Command "Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait

      - name: Kết nối Tailscale vào mạng của mày
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-kMsQcsudYh11CNTRL-2KejT6PG9H5NqHhLzPoMH5adtFhaMfNBK   --hostname=github-cloud-pc
          
      - name: Lấy địa chỉ IP Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
      - name: Giữ kết nối
        run: |
          Start-Sleep -Seconds 21600
